<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Zielony kotek uwu">
  <defs>
    <radialGradient id="futro" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#c6f08a"/>
      <stop offset="55%" stop-color="#9fd85f"/>
      <stop offset="100%" stop-color="#7cbf3f"/>
    </radialGradient>
    <linearGradient id="antena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6e77c"/>
      <stop offset="100%" stop-color="#86c748"/>
    </linearGradient>
    <!-- lekkie rozmycie krawędzi = wrażenie futerka -->
    <filter id="puch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <g filter="url(#puch)">
    <!-- antenki -->
    <g fill="url(#antena)" stroke="#79b840" stroke-width="0.5">
      <path d="M40 34 C 38 22, 37 15, 39 12 C 41 15, 41 24, 43 33 Z"/>
      <circle cx="39.2" cy="11.6" r="2.4"/>
      <path d="M60 34 C 62 22, 63 15, 61 12 C 59 15, 59 24, 57 33 Z"/>
      <circle cx="60.8" cy="11.6" r="2.4"/>
    </g>

    <!-- uszy -->
    <path d="M23 44 C 20 33, 24 30, 30 36 C 30 40, 28 44, 26 47 Z" fill="#8ecb4e"/>
    <path d="M77 44 C 80 33, 76 30, 70 36 C 70 40, 72 44, 74 47 Z" fill="#8ecb4e"/>

    <!-- głowa / ciało -->
    <path d="M50 30
             C 68 30, 82 44, 82 63
             C 82 82, 68 92, 50 92
             C 32 92, 18 82, 18 63
             C 18 44, 32 30, 50 30 Z" fill="url(#futro)"/>

    <!-- policzki (delikatny róż) -->
    <ellipse cx="34" cy="66" rx="6" ry="4" fill="#f6a8c0" opacity="0.35"/>
    <ellipse cx="66" cy="66" rx="6" ry="4" fill="#f6a8c0" opacity="0.35"/>
  </g>

  <!-- oczy: przymrużone, ciemnozielone -->
  <g fill="#1f4d18">
    <ellipse cx="39" cy="58" rx="3.1" ry="4.1"/>
    <ellipse cx="61" cy="58" rx="3.1" ry="4.1"/>
    <circle cx="40.2" cy="56.4" r="1" fill="#eafff0" opacity="0.9"/>
    <circle cx="62.2" cy="56.4" r="1" fill="#eafff0" opacity="0.9"/>
  </g>

  <!-- nosek + pyszczek -->
  <path d="M48.4 68 L 51.6 68 L 50 70.2 Z" fill="#e58aa6"/>
  <path d="M50 70.2 L 50 72.4 M 50 72.4 C 48.4 72.4, 47.4 71.4, 47 70.6 M 50 72.4 C 51.6 72.4, 52.6 71.4, 53 70.6"
        stroke="#4c7a34" stroke-width="0.7" fill="none" stroke-linecap="round"/>
</svg>
